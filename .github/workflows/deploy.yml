name: Deploy CoreServer

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: core-server-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '20'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests if available
        run: npm test --if-present

      - name: Run lint if available
        run: npm run lint --if-present

  deploy-production:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on:
      - self-hosted
      - linux
      - x64
      - gamepedia-core
      - deploy
      - ec2-us-east-1
    environment: production
    timeout-minutes: 30

    steps:
      - name: Sync production clone to pushed commit
        env:
          TARGET_BRANCH: main
          TARGET_DIR_NAME: GamePediaCoreServer-prod
        run: |
          set -euo pipefail
          TARGET_DIR="${HOME}/${TARGET_DIR_NAME}"

          [ "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}" ] || { echo "Wrong trigger branch: ${GITHUB_REF_NAME}"; exit 1; }
          [ -d "${TARGET_DIR}/.git" ] || { echo "Missing git working tree: ${TARGET_DIR}"; exit 1; }

          cd "${TARGET_DIR}"

          [ "$(basename "${PWD}")" = "${TARGET_DIR_NAME}" ] || { echo "Wrong directory: ${PWD}"; exit 1; }
          [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "Tracked files have uncommitted changes in ${TARGET_DIR}"; exit 1; }
          [ "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}" ] || { echo "Wrong branch checked out in ${TARGET_DIR}"; exit 1; }

          git fetch --no-tags --prune origin \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" \
            "${GITHUB_SHA}"

          git checkout "${TARGET_BRANCH}"
          git reset --hard "${GITHUB_SHA}"

          [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ] || { echo "Failed to sync ${TARGET_DIR} to ${GITHUB_SHA}"; exit 1; }

          chmod +x deploy.sh deploy-staging.sh scripts/server/*.sh

      - name: Deploy production from dedicated clone
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
          SKIP_PRISMA_MIGRATE_DEPLOY: ${{ vars.SKIP_PRISMA_MIGRATE_DEPLOY }}
          FORCE_PM2_RECREATE: ${{ vars.FORCE_PM2_RECREATE }}
        run: |
          set -euo pipefail
          cd "${HOME}/GamePediaCoreServer-prod"
          ./deploy.sh

  deploy-staging:
    if: ${{ github.ref == 'refs/heads/staging' }}
    needs: validate
    runs-on:
      - self-hosted
      - linux
      - x64
      - gamepedia-core
      - deploy
      - ec2-us-east-1
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Sync staging clone to pushed commit
        env:
          TARGET_BRANCH: staging
          TARGET_DIR_NAME: GamePediaCoreServer-staging
        run: |
          set -euo pipefail
          TARGET_DIR="${HOME}/${TARGET_DIR_NAME}"

          [ "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}" ] || { echo "Wrong trigger branch: ${GITHUB_REF_NAME}"; exit 1; }
          [ -d "${TARGET_DIR}/.git" ] || { echo "Missing git working tree: ${TARGET_DIR}"; exit 1; }

          cd "${TARGET_DIR}"

          [ "$(basename "${PWD}")" = "${TARGET_DIR_NAME}" ] || { echo "Wrong directory: ${PWD}"; exit 1; }
          [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "Tracked files have uncommitted changes in ${TARGET_DIR}"; exit 1; }
          [ "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}" ] || { echo "Wrong branch checked out in ${TARGET_DIR}"; exit 1; }

          git fetch --no-tags --prune origin \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" \
            "${GITHUB_SHA}"

          git checkout "${TARGET_BRANCH}"
          git reset --hard "${GITHUB_SHA}"

          [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ] || { echo "Failed to sync ${TARGET_DIR} to ${GITHUB_SHA}"; exit 1; }

          chmod +x deploy.sh deploy-staging.sh scripts/server/*.sh

      - name: Deploy staging from dedicated clone
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
          SKIP_PRISMA_MIGRATE_DEPLOY: ${{ vars.SKIP_PRISMA_MIGRATE_DEPLOY }}
          FORCE_PM2_RECREATE: ${{ vars.FORCE_PM2_RECREATE }}
        run: |
          set -euo pipefail
          cd "${HOME}/GamePediaCoreServer-staging"
          ./deploy-staging.sh
