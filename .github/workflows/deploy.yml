name: Deploy CoreServer

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: core-server-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests if available
        run: npm test --if-present

      - name: Run lint if available
        run: npm run lint --if-present

  deploy-production:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Deploy production to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            TRIGGER_BRANCH="${{ github.ref_name }}"
            EXPECTED_BRANCH="main"
            EXPECTED_DIR="${HOME}/GamePediaCoreServer-prod"
            [ "${TRIGGER_BRANCH}" = "${EXPECTED_BRANCH}" ] || { echo "Wrong trigger branch: ${TRIGGER_BRANCH}"; exit 1; }
            [ -d "${EXPECTED_DIR}" ] || { echo "Missing deploy directory: ${EXPECTED_DIR}"; exit 1; }
            cd "${EXPECTED_DIR}"
            [ "$(basename "${PWD}")" = "GamePediaCoreServer-prod" ] || { echo "Wrong production directory: ${PWD}"; exit 1; }
            [ "$(git rev-parse --abbrev-ref HEAD)" = "${EXPECTED_BRANCH}" ] || { echo "Wrong branch checked out in production clone"; exit 1; }
            chmod +x deploy.sh deploy-staging.sh scripts/server/*.sh
            ./deploy.sh

  deploy-staging:
    if: ${{ github.ref == 'refs/heads/staging' }}
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Deploy staging to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            TRIGGER_BRANCH="${{ github.ref_name }}"
            EXPECTED_BRANCH="staging"
            EXPECTED_DIR="${HOME}/GamePediaCoreServer-staging"
            [ "${TRIGGER_BRANCH}" = "${EXPECTED_BRANCH}" ] || { echo "Wrong trigger branch: ${TRIGGER_BRANCH}"; exit 1; }
            [ -d "${EXPECTED_DIR}" ] || { echo "Missing deploy directory: ${EXPECTED_DIR}"; exit 1; }
            cd "${EXPECTED_DIR}"
            [ "$(basename "${PWD}")" = "GamePediaCoreServer-staging" ] || { echo "Wrong staging directory: ${PWD}"; exit 1; }
            [ "$(git rev-parse --abbrev-ref HEAD)" = "${EXPECTED_BRANCH}" ] || { echo "Wrong branch checked out in staging clone"; exit 1; }
            chmod +x deploy.sh deploy-staging.sh scripts/server/*.sh
            ./deploy-staging.sh
